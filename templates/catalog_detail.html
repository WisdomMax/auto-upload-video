<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No.{{ item.product_no }} - {{ item.title }} | 엄마아빠 패션다이어리</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
            --gold-color: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 100px; /* For sticky footer */
        }

        /* Background Glows */
        .glow-1 {
            position: absolute;
            top: -10%;
            left: -20%;
            width: 80%;
            height: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -20%;
            width: 80%;
            height: 50%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Container */
        .detail-wrapper {
            width: 100%;
            max-width: 480px; /* Mobile Viewport Breakpoint */
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        /* Header Logo */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 0;
        }
        header i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }
        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        /* Video Card */
        .video-card {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            aspect-ratio: 9 / 16;
            position: relative;
        }
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Product Info Card */
        .info-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .badge-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .product-no-badge {
            background: var(--primary-gradient);
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            letter-spacing: 0.5px;
        }
        .product-title {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
        }
        .divider {
            height: 1px;
            background: var(--border-color);
            width: 100%;
        }
        .product-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-line;
        }

        /* Disclaimer */
        .disclaimer-box {
            font-size: 0.88rem;
            color: #ffffff;
            text-align: center;
            line-height: 1.6;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-top: 12px;
        }

        /* Sticky Footer Purchase Button */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            justify-content: center;
            z-index: 100;
        }
        .footer-container {
            width: 100%;
            max-width: 480px;
        }
        .btn-purchase {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-purchase:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }
        .btn-purchase i {
            font-size: 1.2rem;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="detail-wrapper">
        <!-- Brand Header -->
        <header>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <h1>엄마아빠 패션다이어리</h1>
        </header>

        <!-- Video Player -->
        <div class="video-card">
            <video id="player" autoplay loop muted playsinline controls>
                <source src="{{ video_src }}" type="video/mp4">
                지원되지 않는 브라우저입니다.
            </video>
        </div>

        <!-- Product Info Box -->
        <div class="info-card">
            <div class="badge-row">
                <span class="product-no-badge">No. {{ item.product_no }}</span>
            </div>
            <h2 class="product-title">{{ item.title }}</h2>
            <div class="divider"></div>
            <p class="product-desc">{{ item.description }}</p>
        </div>

        <!-- 쿠팡 파트너스 안내 문구 -->
        <div class="disclaimer-box">
            이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
        </div>
    </div>

    <!-- 하단 고정 구매 버튼 -->
    <div class="sticky-footer">
        <div class="footer-container">
            <a href="{{ purchase_link }}" class="btn-purchase" target="_blank">
                <i class="fa-solid fa-cart-shopping"></i> 쿠팡 최저가 확인하기
            </a>
        </div>
    </div>

    <script>
        // 모바일 사파리 등에서 동영상 탭 터치 시 재생 관련 대응
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            if (video) {
                // 클릭 시 일시정지/재생 제어 지원
                video.addEventListener('click', () => {
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                });
            }
        });
    </script>
</body>
</html>
