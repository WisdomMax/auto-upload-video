<html lang="ko">
<head>

    <!-- Google Fonts: Elegant Serif & Minimalist Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+KR:wght@200;300;400;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->

    <style>
        :root {
            --color-bg: #0a0a0a;          /* Matte Jet Black */
            --color-surface: #121212;     /* Dark Gallery Charcoal */
            --color-border: rgba(255, 255, 255, 0.05); /* Thin Frame Line */
            --color-text-primary: #e5e5e5;  /* Editorial Off-white */
            --color-text-secondary: #8a8a8a;/* Silver Dust */
            --color-gold: #bca374;        /* Antique Bronze Gold */
            --font-serif: 'Cormorant Garamond', 'Noto Serif KR', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-bg);
            font-family: var(--font-sans);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 100px;
            letter-spacing: -0.01em;
            word-break: keep-all;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        /* Top Disclaimer Banner - Slim, minimal, gold accent line */
        .disclaimer-banner {
            width: 100%;
            background: #111111;
            border-bottom: 1px solid rgba(188, 163, 116, 0.3);
            color: #ffffff;               /* Clear white for legal compliance */
            padding: 14px 16px;
            font-size: 0.88rem;            /* Significantly enlarged */
            text-align: center;
            font-weight: 500;             /* Increased weight */
            letter-spacing: 0.03em;
            position: relative;
        }
        .disclaimer-banner::before {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
        }
        .disclaimer-banner i {
            color: var(--color-gold);
            margin-right: 4px;
        }

        /* Editorial Header */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 64px 0 24px 0;
            text-align: center;
        }
        header .brand-subtitle {
            font-family: var(--font-sans);
            font-size: 0.62rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--color-gold);
        }
        header h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: var(--color-text-primary);
        }
        header h1 span {
            font-weight: 300;
            font-style: italic;
            color: var(--color-gold);
        }
        header .header-divider {
            width: 30px;
            height: 1px;
            background-color: var(--color-gold);
            margin-top: 12px;
            opacity: 0.5;
        }

        /* Search Section */
        .search-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        
        .search-label-text {
            text-align: center;
            margin-bottom: 18px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .search-label-text .main-instruction {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .search-label-text .main-instruction .highlight {
            color: #ffe600;
            text-decoration: underline;
            font-weight: 700;
        }
        .search-label-text .sub-instruction {
            font-size: 0.95rem;
            color: #b0b0b0;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .search-label-text .sub-instruction .example-num {
            color: #ffe600;
            font-weight: 700;
        }
        .search-label-text .sub-instruction .example-code {
            color: var(--color-gold);
            font-weight: 600;
        }
        
        /* Floating Sticky mode (Hidden state by default) */
        .search-container.floating {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            width: calc(100% - 48px);
            max-width: 500px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        
        .search-container.floating input {
            background: #ffffff !important;
            border-color: var(--color-gold) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8) !important;
            color: #111111 !important;
        }

        /* Floating Sticky mode (Visible state) */
        .search-container.floating.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .search-container input {
            width: 100%;
            padding: 16px 20px 16px 54px;
            background: #ffffff;
            border: 3px solid var(--color-gold);
            border-radius: 8px;
            color: #111111;
            font-size: 1.1rem;
            font-family: var(--font-sans);
            font-weight: 600;
            outline: none;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .search-container input::placeholder {
            color: #666666;
            opacity: 1;
            font-weight: 500;
        }
        .search-container input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(188, 163, 116, 0.4);
            background: #fdfdfd;
        }
        .search-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #333333;
            font-size: 1.3rem;
            pointer-events: none;
            z-index: 5;
        }
        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
                gap: 28px;
            }
            header {
                padding: 36px 0 16px 0;
                gap: 8px;
            }
            header h1 {
                font-size: 1.7rem;
                white-space: nowrap;
            }
            header .brand-subtitle {
                letter-spacing: 0.25em;
            }
            .search-label-text .main-instruction {
                font-size: 1.15rem !important;
            }
            .search-label-text .sub-instruction {
                font-size: 0.88rem !important;
            }
            .search-container input {
                padding: 14px 16px 14px 44px;
                font-size: 0.95rem;
            }
            .search-container i {
                left: 16px;
                font-size: 1.1rem;
            }
            .catalog-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 16px !important;
            }
            .product-code-display {
                font-size: 1.4rem !important;
                letter-spacing: 0.12em !important;
            }
            .product-info {
                padding: 10px 8px !important;
            }
        }

        /* Grid Layout */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            width: 100%;
        }

        @media (min-width: 576px) {
            .catalog-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
        }

        @media (min-width: 992px) {
            .catalog-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 36px;
            }
        }

        @media (min-width: 1200px) {
            .catalog-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 40px;
            }
        }

        /* Product Card */
        .product-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(188, 163, 116, 0.3);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        /* Thumbnail Wrapper with Editorial Aspect Ratio (9:16) */
        .thumb-wrapper {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: linear-gradient(135deg, #151515 0%, #0c0c0c 100%);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .thumb-wrapper::before {
            content: '\f03e'; /* FontAwesome Image placeholder icon */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 2rem;
            color: #1e1e1e;
            position: absolute;
            z-index: 1;
            transition: color 0.4s ease;
        }
        .product-card:hover .thumb-wrapper::before {
            color: #262626;
        }
        
        /* Model Code inside placeholder */
        .placeholder-code {
            position: absolute;
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 300;
            color: rgba(188, 163, 116, 0.12);
            letter-spacing: 0.1em;
            z-index: 2;
            pointer-events: none;
            text-transform: uppercase;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 3;
            filter: grayscale(12%) contrast(1.03);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), filter 0.8s ease;
        }
        
        /* Hide broken image elements smoothly */
        .thumb-wrapper img.error {
            display: none !important;
            opacity: 0;
            z-index: 0;
        }

        .product-card:hover .thumb-wrapper img {
            transform: scale(1.03);
            filter: grayscale(0%) contrast(1);
        }

        /* Info Section - Minimalist Display for code only */
        .product-info {
            padding: 16px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            border-top: 1px solid var(--color-border);
        }
        
        .product-code-display {
            font-family: var(--font-serif);
            font-size: 1.8rem;             /* 1.45rem -> 1.8rem으로 크게 노출 */
            font-weight: 300;
            color: var(--color-gold);
            letter-spacing: 0.18em;        /* 자간을 넓혀 에디토리얼 감성 강화 */
            text-transform: uppercase;
            transition: color 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), letter-spacing 0.4s ease;
        }
        
        .product-card:hover .product-code-display {
            color: #ffffff;
            letter-spacing: 0.22em;       /* 호버 시 글자 자간이 미세하게 늘어나는 고급스러운 효과 */
            transform: scale(1.02);       /* 미세 호버 효과 */
        }

        /* Empty search state */
        .search-empty {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem;
            color: var(--color-text-secondary);
            text-align: center;
            gap: 16px;
            font-family: var(--font-serif);
        }
        .search-empty i {
            font-size: 2rem;
            color: var(--color-gold);
            opacity: 0.6;
        }
        .search-empty p {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }
    </style>
</head>

            const val = e.target.value;
            floatingInput.value = val;
            renderProducts(val);
        });

        floatingInput.addEventListener('input', (e) => {
            const val = e.target.value;
            originalInput.value = val;
            renderProducts(val);
        });

        // 스크롤 감지 플로팅 검색창 로직
        let lastScrollY = window.scrollY;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            
            // 원래 검색창 컨테이너의 하단 위치를 스크롤 기준점으로 계산
            const originalBottom = originalContainer.getBoundingClientRect().bottom + window.scrollY;
            
            if (currentScrollY <= originalBottom) {
                // 원래 검색창이 화면 내에 머물 때는 플로팅 노출 안함
                floatingContainer.classList.remove('visible');
                lastScrollY = currentScrollY;
                return;
            }
            
            if (currentScrollY < lastScrollY) {
                // 위로 스크롤할 때 플로팅 검색창 슥 출현
                floatingContainer.classList.add('visible');
            } else {
                // 아래로 스크롤할 때는 스르륵 퇴장
                floatingContainer.classList.remove('visible');
            }
            
            lastScrollY = currentScrollY;
        }, { passive: true });

        // 초기화
        renderProducts();
    </script>
</body>
</html>
